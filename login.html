<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sari-Sari Store - Login</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: rgb(255, 248, 240);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        
        /* Login Form Container */
        .login-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        
        /* Header */
        .login-header {
            background-color: #4a6741;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        
        .login-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        /* Form */
        .login-form {
            padding: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #555;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            border-color: #4a6741;
            outline: none;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .remember-me input {
            margin-right: 0.5rem;
        }
        
        .login-btn {
            background-color: #4a6741;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        .login-btn:hover {
            background-color: #3d5635;
        }
        
        .login-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .login-footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid #eee;
        }
        
        .login-footer a {
            color: #4a6741;
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        /* Error message */
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        
        /* Timer */
        .timer-container {
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
        
        .timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .attempts-left {
            font-size: 0.9rem;
            color: #555;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Sari-Sari Store</h1>
            <p>Login to your account</p>
        </div>
        
        <div class="login-form">
            <div class="error-message" id="error-message">
                Invalid username or password. Please try again.
            </div>
            
            <div class="timer-container" id="timer-container">
                <p>Too many failed attempts. Please wait:</p>
                <div class="timer" id="timer">10</div>
                <p class="attempts-left" id="attempts-left">You have 1 attempt left.</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                
                <button type="submit" class="login-btn" id="login-btn">Login</button>
            </form>
        </div>
        
        <div class="login-footer">
            <p>Don't have an account? <a href="#">Register</a></p>
            <p><a href="#">Forgot Password?</a></p>
        </div>
    </div>
    
    <script>
        // Demo credentials (in a real app, this would be verified on the server)
        const validCredentials = {
            username: 'admin123',
            password: 'admin123'
        };
        
        // Elements
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer');
        const attemptsLeftDisplay = document.getElementById('attempts-left');
        
        // Login attempt tracking
        let attemptCount = 0;
        const maxAttempts = 2;
        let lockoutTime = 10; // seconds
        let lockoutTimer;
        let isLocked = false;
        
        // Handle form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (isLocked) return;
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            // Check credentials
            if (username === validCredentials.username && password === validCredentials.password) {
                // Successful login
                errorMessage.style.display = 'none';
                timerContainer.style.display = 'none';
                alert('Login successful! Redirecting to main website...');
                // Redirect to the main website
                window.location.href = 'index.html';
                
                // Reset attempts
                attemptCount = 0;
            } else {
                // Failed login
                attemptCount++;
                
                if (attemptCount >= maxAttempts) {
                    lockAccount();
                } else {
                    // Show error and update attempts left
                    errorMessage.style.display = 'block';
                    const attemptsLeft = maxAttempts - attemptCount;
                    attemptsLeftDisplay.textContent = `You have ${attemptsLeft} attempt${attemptsLeft !== 1 ? 's' : ''} left.`;
                }
            }
        });
        
        // Lock account function
        function lockAccount() {
            isLocked = true;
            errorMessage.style.display = 'block';
            timerContainer.style.display = 'block';
            loginBtn.disabled = true;
            
            // Update display
            errorMessage.textContent = 'Too many failed login attempts. Please wait before trying again.';
            
            // Start countdown
            lockoutTime = 10;
            timerDisplay.textContent = lockoutTime;
            
            lockoutTimer = setInterval(function() {
                lockoutTime--;
                timerDisplay.textContent = lockoutTime;
                
                if (lockoutTime <= 0) {
                    // Unlock after countdown
                    clearInterval(lockoutTimer);
                    unlockAccount();
                }
            }, 1000);
        }
        
        // Unlock account function
        function unlockAccount() {
            isLocked = false;
            timerContainer.style.display = 'none';
            errorMessage.style.display = 'none';
            loginBtn.disabled = false;
            
            // Reset form
            loginForm.reset();
            
            // Reset attempt counter
            attemptCount = 0;
        }
    </script>
</body>
</html>
